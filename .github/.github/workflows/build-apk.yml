name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'www/app.apk'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build unsigned debug APK (fallback if no keystore secrets yet)
        if: env.HAS_KEYSTORE == 'false'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect the built APK
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          else
            APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          fi
          echo "Found APK at: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "No APK file found!" >&2
            find android/app/build/outputs -type f
            exit 1
          fi
          cp "$APK_PATH" /tmp/final.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-schedule-apk
          path: /tmp/final.apk

      - name: Publish APK into the website (so it deploys via Cloudflare Pages too)
        run: |
          cp /tmp/final.apk www/app.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www/app.apk
          if ! git diff --cached --quiet; then
            git commit -m "Update built APK (auto)"
            git push
          else
            echo "APK unchanged, nothing to commit."
          fi
