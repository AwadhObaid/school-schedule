name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'www/app.apk'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-schedule-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK into the website (so it deploys via Cloudflare Pages too)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk www/app.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www/app.apk
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Update built APK"
            git push
          else
            echo "APK unchanged, nothing to commit."
          fi
