name: Build Exam Preview APK

on:
  push:
    branches:
      - fix/exam-preview-raster-crash
    paths:
      - 'flutter_v2/**'
      - '.github/workflows/flutter-v2-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: school-schedule-exam-preview-debug-apk
          path: flutter_v2/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
