name: Build Exam Preview APK

on:
  push:
    branches:
      - fix/exam-preview-raster-crash
    paths:
      - 'flutter_v2/**'
      - '.github/workflows/flutter-v2-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This Flutter V2 directory was committed without its Android platform
      # scaffold. Generate only the missing Android host project before building.
      - name: Generate missing Android platform scaffold
        run: flutter create --platforms=android --org com.salaheddine --project-name schedule .

      - name: Verify Android application id
        shell: bash
        run: |
          grep -R 'applicationId' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true
          grep -R 'namespace' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

      - name: Resolve packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Verify APK exists
        shell: bash
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: school-schedule-exam-preview-debug-apk
          path: flutter_v2/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
