name: Flutter V2 CI

on:
  push:
    branches:
      - flutter-v2-phase01-foundation
    paths:
      - 'flutter_v2/**'
      - '.github/workflows/flutter-v2-ci.yml'
  pull_request:
    paths:
      - 'flutter_v2/**'
      - '.github/workflows/flutter-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
