name: schedule
description: Flutter V2 foundation for the School Schedule teacher assistant.
publish_to: 'none'
version: 2.11.6+28

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  archive: ^4.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  math_keyboard: ^0.4.0
  flutter_math_fork: ^0.7.4
  pdf: ^3.11.3
  printing: ^5.14.3
  pdf_widget_wrapper: ^1.0.4
  timezone: ^0.11.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
